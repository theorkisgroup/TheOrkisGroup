media:
  input: images
  output: /images

content:
  - name: website_data
    label: "Website Content"
    type: file
    path: data.json
    fields:
      - name: hero_title
        label: "Hero Title"
        type: string
      - name: hero_subtitle
        label: "Hero Subtitle"
        type: text
      - name: services_title
        label: "Services Section Headline"
        type: string
      - name: services
        label: "Our Expertise (Services)"
        type: object
        list: true
        fields:
          - name: title
            label: "Service Name"
            type: string
          - name: description
            label: "Service Description"
            type: text
      - name: properties
        label: "Our Properties"
        type: object
        list: true
        fields:
          - name: title
            label: "Property Name"
            type: string
          - name: location
            label: "Location"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: image
            label: "Photo"
            type: image
